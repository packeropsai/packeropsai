apiVersion: v1
kind: Namespace
metadata:
  name: packerops-system
  labels:
    app.kubernetes.io/name: packerops
    app.kubernetes.io/part-of: packerops-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: packerops-scheduler-sa
  namespace: packerops-system
  labels:
    app.kubernetes.io/name: packerops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: packerops-scheduler-role
  labels:
    app.kubernetes.io/name: packerops
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/binding"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: packerops-scheduler-binding
  labels:
    app.kubernetes.io/name: packerops
subjects:
  - kind: ServiceAccount
    name: packerops-scheduler-sa
    namespace: packerops-system
roleRef:
  kind: ClusterRole
  name: packerops-scheduler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: packerops-scheduler
  namespace: packerops-system
  labels:
    app.kubernetes.io/name: packerops
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: packerops
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: packerops
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: packerops-scheduler-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: packerops-scheduler
          image: ghcr.io/packeropsai/packerops-scheduler:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/packerops-scheduler
            - --leader-elect=true
            - --scheduler-name=packerops-scheduler
            - --port=10259
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "200m"
              memory: "256Mi"
          ports:
            - name: metrics
              containerPort: 10259
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 10259
            initialDelaySeconds: 10
            periodSeconds: 5
